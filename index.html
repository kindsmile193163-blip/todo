<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 할 일</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@kfonts/nanum-handwritting-tta-agdandan@0.2.0/index.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { display: flex; justify-content: center; padding: 16px; }

/* 가로:세로 = 3.5:1 (폭을 바꾸면 비율 유지하며 같이 줄고 늘어납니다) */
.todo {
  container-type: inline-size;
  width: min(100%, 700px);
  aspect-ratio: 3.5 / 1;
  font-family: '나눔손글씨 따악단단', 'Nanum DdaAgDanDan', 'Nanum Pen Script', cursive;
  color: #333;
}
.title {
  display: flex; align-items: center; gap: 1cqw;
  height: 6.4cqw;
  padding: 0 1.2cqw;
  background: #f5ebe7;
  border-radius: 1cqw;
  font-size: 5.0cqw;
  font-weight: bold;
  line-height: 1;
}
.list { padding: 1cqw 0.4cqw 0; }
.row {
  display: flex; align-items: center; gap: 1.2cqw;
  height: 4.4cqw;
}
.row input[type=checkbox] {
  appearance: none; -webkit-appearance: none;
  flex: none;
  width: 2.4cqw; height: 2.4cqw;
  margin: 0;
  border: 0.18cqw solid #333;
  border-radius: 0.5cqw;
  background: #fff;
  cursor: pointer;
  position: relative;
}
.row input[type=checkbox]:checked::after {
  content: ''; position: absolute;
  left: 0.65cqw; top: 0.15cqw;
  width: 0.65cqw; height: 1.4cqw;
  border: solid #333; border-width: 0 0.22cqw 0.22cqw 0;
  transform: rotate(45deg);
}
.row input[type=text] {
  flex: 1; min-width: 0;
  border: 0; border-bottom: 0.1cqw dashed transparent;
  background: transparent; outline: none;
  font: inherit; font-size: 4.3cqw; color: #333;
  padding: 0; margin: 0; height: 100%;
  text-align: left; text-indent: 0; direction: ltr;
}
.row input[type=text]:focus { border-bottom-color: #d9c5bd; }
.row input[type=checkbox]:checked + input[type=text] {
  text-decoration: line-through; color: #aaa;
}
</style>
</head>
<body>
<div class="todo">
  <div class="title"><span>✏️</span><span>오늘의 할 일</span></div>
  <div class="list">
    <!-- ▼ 할 일은 아래 value="" 안의 글자만 바꾸면 됩니다 (체크 상태: 체크하려면 <input type="checkbox" checked>) -->
    <label class="row"><input type="checkbox" checked><input type="text" spellcheck="false" value="루카스는 바보야!!!!!!!"></label>
    <label class="row"><input type="checkbox"><input type="text" spellcheck="false" value=""></label>
    <label class="row"><input type="checkbox"><input type="text" spellcheck="false" value=""></label>
    <label class="row"><input type="checkbox"><input type="text" spellcheck="false" value=""></label>
    <label class="row"><input type="checkbox"><input type="text" spellcheck="false" value=""></label>
  </div>
</div>
</body>
</html>
